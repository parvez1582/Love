<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️ jubaida</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#080008;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

/* পুরো Heart */
.heart{
    position:relative;
    width:520px;
    height:520px;
    animation:rotateHeart 12s linear infinite;
}

/* প্রতিটা I LOVE YOU */
.love{
    position:absolute;
    left:50%;
    top:50%;

    color:#ff4d88;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;

    text-shadow:
        0 0 5px #ff1744,
        0 0 12px #ff1744;

    transform:
        translate(-50%,-50%)
        translate(var(--x),var(--y));

    animation:bounce 1.2s ease-in-out infinite;
    animation-delay:var(--delay);
}

/* Heart-এর হালকা rotation */
@keyframes rotateHeart{
    0%{
        transform:rotate(0deg) scale(1);
    }

    25%{
        transform:rotate(3deg) scale(1.03);
    }

    50%{
        transform:rotate(0deg) scale(1.06);
    }

    75%{
        transform:rotate(-3deg) scale(1.03);
    }

    100%{
        transform:rotate(0deg) scale(1);
    }
}

/* লেখাগুলোর jumping */
@keyframes bounce{

    0%,100%{
        margin-top:0px;
    }

    50%{
        margin-top:-8px;
    }
}

/* Mobile */
@media(max-width:600px){

    .heart{
        width:340px;
        height:340px;
    }

    .love{
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="heart" id="heart"></div>

<script>

/*
   Mathematical Heart Formula

   x = 16 sin³(t)

   y = -(13cos(t)
        -5cos(2t)
        -2cos(3t)
        -cos(4t))
*/

const heart = document.getElementById("heart");

const total = 70;

for(let i=0; i<total; i++){

    let t = (Math.PI * 2 * i) / total;

    let x = 16 * Math.pow(Math.sin(t),3);

    let y = -(
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t)
    );

    /*
       Heart-এর size
    */

    let scale = 14;

    let love = document.createElement("div");

    love.className = "love";

    love.innerText = "I LOVE YOU Jubaida ❤️";

    love.style.setProperty(
        "--x",
        (x * scale) + "px"
    );

    love.style.setProperty(
        "--y",
        (y * scale) + "px"
    );

    love.style.setProperty(
        "--delay",
        (Math.random() * 1.5) + "s"
    );

    heart.appendChild(love);
}

</script>

</body>
</html>
